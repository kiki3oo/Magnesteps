<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Energy Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Amber Energy Glow -->
    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- MagneSteps Brand Icon (Anatomical Acupressure Foot with Magnetic Energy Points) -->
  <g transform="translate(10, 8)">
    <!-- Outer energy contour of foot -->
    <path d="M 22 14 C 28 8, 38 10, 42 16 C 46 22, 45 32, 44 42 C 43 47, 46 54, 52 58 C 58 62, 66 63, 72 63 C 78 63, 80 67, 78 71 C 75 75, 65 75, 52 74 C 40 73, 28 68, 20 58 C 14 50, 15 36, 17 26 Z" 
          stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95" filter="url(#glow-cyan)" />

    <!-- Inner anatomical / arch reflexology nerve lines -->
    <path d="M 36 20 C 37 28, 36 38, 38 46 C 40 52, 45 56, 54 58 C 62 60, 68 60, 72 61" 
          stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8" />
          
    <path d="M 27 34 C 29 42, 32 50, 38 56 C 44 61, 52 65, 62 66" 
          stroke="#0284c7" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Acupressure / Magnetic Nodes (Amber Glowing Points) -->
    <!-- Point 1: Heel -->
    <circle cx="25" cy="54" r="3.5" fill="#f59e0b" filter="url(#glow-amber)" />
    <circle cx="25" cy="54" r="1.8" fill="#ffffff" />
    <circle cx="25" cy="54" r="6.5" stroke="#fbbf24" stroke-width="1" opacity="0.7" fill="none" />

    <!-- Point 2: Arch / Solar Plexus -->
    <circle cx="44" cy="58" r="3.5" fill="#f59e0b" filter="url(#glow-amber)" />
    <circle cx="44" cy="58" r="1.8" fill="#ffffff" />
    <circle cx="44" cy="58" r="6.5" stroke="#fbbf24" stroke-width="1" opacity="0.7" fill="none" />

    <!-- Point 3: Ball of Foot -->
    <circle cx="64" cy="65" r="3.5" fill="#f59e0b" filter="url(#glow-amber)" />
    <circle cx="64" cy="65" r="1.8" fill="#ffffff" />
    <circle cx="64" cy="65" r="6.5" stroke="#fbbf24" stroke-width="1" opacity="0.7" fill="none" />
  </g>

  <!-- Typography Lockup -->
  <!-- "Magne" in Amber/Gold -->
  <text x="105" y="48" font-family="'Cairo', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="36" fill="url(#amber-grad)" letter-spacing="-0.5">Magne</text>

  <!-- "Steps" in Pure White -->
  <text x="228" y="48" font-family="'Cairo', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="-0.5">Steps</text>

  <!-- Trademark TM -->
  <text x="336" y="28" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#94a3b8">™</text>

  <!-- Slogan: MAKE EVERY STEP COUNT in Sky Cyan -->
  <text x="106" y="70" font-family="'Cairo', 'Montserrat', -apple-system, sans-serif" font-weight="800" font-size="12" fill="#38bdf8" letter-spacing="2.2">MAKE EVERY STEP COUNT</text>

  <!-- Subtle Medical / Acupressure Accent Indicator -->
  <circle cx="330" cy="66" r="2" fill="#f59e0b" />
  <text x="338" y="70" font-family="'Cairo', sans-serif" font-weight="700" font-size="10" fill="#94a3b8">الأصلي بالمغرب</text>
</svg>
